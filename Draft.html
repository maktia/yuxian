<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S11 新聞草稿編輯區｜看見・未見｜育賢國中</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
body{margin:0;font-family:'Noto Sans TC','PingFang TC',sans-serif}
a{color:#395860}a:hover{color:#1C2B2F}
</style>
<style>html,body{margin:0;padding:0}</style>
</head>
<body>

<div style="width: 412px; height: 917px; box-sizing: border-box; padding: 20px 20px 32px 20px; display: flex; flex-direction: column; gap: 14px; background: #ECF6F9; color: #1C2B2F; font-family: 'Noto Sans TC', 'PingFang TC', sans-serif;">

  <div style="display: flex; justify-content: space-between; align-items: center;">
    <a href="Transcript.html" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px 0 12px; border-radius: 20px; background: #FFFFFF; border: 2px solid #ACD9E4; color: #395860; font-size: 15px; font-weight: 700; text-decoration: none;">
      <span style="font-size: 20px;">‹</span><span>上一頁</span>
    </a>
    <div style="display: flex; align-items: center; height: 40px; padding: 0 14px; border-radius: 20px; background: #FFFFFF; border: 2px solid #ACD9E4; color: #1C2B2F; font-size: 15px; font-weight: 700;">草稿・自動存檔</div>
  </div>

  <h1 style="margin: 4px 0 0 0; font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 2px; line-height: 1.2;">寫你的新聞</h1>

  <div style="box-sizing: border-box; padding: 14px 16px; border-radius: 20px; background: #FFFFFF; border: 3px dashed #7FC4D6; display: flex; align-items: flex-start; gap: 12px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F6E85" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 3px;" aria-hidden="true"><path d="M7 7h4v5a4 4 0 0 1-4 4z"></path><path d="M14 7h4v5a4 4 0 0 1-4 4z"></path></svg>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 17px; line-height: 1.6; color: #1C2B2F;">「這個坡太陡了，我每次都要停下來喘一下。」</span>
      <span style="font-size: 14px; color: #5E6E73;">長按可以拖進下面的稿子</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <label for="title" style="font-size: 17px; font-weight: 700; color: #1C2B2F;">新聞標題</label>
    <input id="title" type="text" value="走廊斜坡太陡，師生推車都卡關" style="box-sizing: border-box; width: 100%; height: 56px; padding: 0 20px; border-radius: 28px; background: #FFFFFF; border: 3px solid #ACD9E4; font-family: 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 18px; color: #1C2B2F;">
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between;">
    <label for="body" style="font-size: 17px; font-weight: 700; color: #1C2B2F;">內文</label>
    <span style="font-size: 15px; color: #5E6E73;">186 字</span>
  </div>

  <textarea id="body" style="box-sizing: border-box; flex-grow: 1; width: 100%; padding: 18px 20px; border-radius: 24px; background: #FFFFFF; border: 3px solid #ACD9E4; font-family: 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 18px; line-height: 1.8; color: #1C2B2F; resize: none;">本校東側走廊盡頭的斜坡，是這個超可怕的設計，每天都有人差點跌倒。校工陳阿姨說：「這個坡太陡了，我每次都要停下來喘一下。」她每天要推回收車經過三次。學校應該早就知道了卻不處理。目前扶手只裝了一側，下雨後地面磁磚會反光。</textarea>

  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 18px; background: #FFFFFF; border: 2px dashed #ACD9E4;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#395860" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16v.01"></path></svg>
    <span style="font-size: 16px; line-height: 1.5; color: #3D3752;">寫完一定要掃描過，才可以上傳。</span>
  </div>

  <a href="Scan.html" style="display: flex; align-items: center; justify-content: center; align-self: center; width: 330px; height: 68px; border-radius: 34px; background: #7FC4D6; box-shadow: 0 6px 0 #669DAB; color: #1C2B2F; font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-size: 25px; letter-spacing: 2px; text-decoration: none;">新聞毒物掃描</a>

</div>

</body>
</html>
