<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S09 採訪問題清單｜看見・未見｜育賢國中</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans TC','PingFang TC',sans-serif}
a{color:#395860}a:hover{color:#1C2B2F}
</style>
<style>html,body{margin:0;padding:0}</style>
</head>
<body>

<div style="width: 412px; height: 917px; box-sizing: border-box; padding: 20px 20px 32px 20px; display: flex; flex-direction: column; gap: 14px; background: #ECF6F9; color: #1C2B2F; font-family: 'Noto Sans TC', 'PingFang TC', sans-serif;">

  <div style="display: flex; justify-content: space-between; align-items: center;">
    <a href="Tasks.html" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px 0 12px; border-radius: 20px; background: #FFFFFF; border: 2px solid #ACD9E4; color: #395860; font-size: 15px; font-weight: 700; text-decoration: none;">
      <span style="font-size: 20px;">&lsaquo;</span><span>上一頁</span>
    </a>
    <div style="display: flex; align-items: center; height: 40px; padding: 0 14px; border-radius: 20px; background: #FFF3DC; border: 2px solid #E0A03C; color: #8A5000; font-size: 15px; font-weight: 700;">第 3 堂・採訪</div>
  </div>

  <h1 style="margin: 2px 0 0 0; font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 2px; line-height: 1.2;">先想好要問什麼</h1>
  <p style="margin: -4px 0 0 0; font-size: 17px; line-height: 1.55; color: #3D3752;">問題先寫下來，訪問時照著問。錄音會<strong style="color: #1C2B2F;">一題一段</strong>，之後整理比較好找。</p>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <label for="who" style="font-size: 17px; font-weight: 700; color: #1C2B2F;">你要訪問誰</label>
    <input id="who" type="text" value="校工 陳阿姨" style="box-sizing: border-box; width: 100%; height: 58px; padding: 0 20px; border-radius: 29px; background: #FFFFFF; border: 3px solid #ACD9E4; font-family: 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 19px; color: #1C2B2F;">
  </div>

  <div style="display: flex; align-items: baseline; justify-content: space-between;">
    <span style="font-size: 17px; font-weight: 700; color: #1C2B2F;">你的問題</span>
    <span style="font-size: 15px; color: #5E6E73;">3 題</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 12px; box-sizing: border-box; padding: 12px 16px; border-radius: 20px; background: #FFFFFF; border: 3px solid #ACD9E4;">
      <span style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 16px; background: #CCE7EF; color: #1C2B2F; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">1</span>
      <span style="flex-grow: 1; font-size: 17px; line-height: 1.5; color: #1C2B2F;">你每天都要推車經過這邊嗎？</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; box-sizing: border-box; padding: 12px 16px; border-radius: 20px; background: #FFFFFF; border: 3px solid #ACD9E4;">
      <span style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 16px; background: #CCE7EF; color: #1C2B2F; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">2</span>
      <span style="flex-grow: 1; font-size: 17px; line-height: 1.5; color: #1C2B2F;">這個坡推起來會不會很難？</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; box-sizing: border-box; padding: 12px 16px; border-radius: 20px; background: #FFFFFF; border: 3px solid #ACD9E4;">
      <span style="flex-shrink: 0; width: 32px; height: 32px; border-radius: 16px; background: #CCE7EF; color: #1C2B2F; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">3</span>
      <span style="flex-grow: 1; font-size: 17px; line-height: 1.5; color: #1C2B2F;">你覺得要怎麼改比較好？</span>
    </div>
  </div>

  <button type="button" style="box-sizing: border-box; width: 100%; height: 58px; border-radius: 20px; background: #FFFFFF; border: 3px dashed #7FC4D6; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F6E85" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    <span style="font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-size: 19px; color: #1F6E85;">再加一題</span>
  </button>

  <div style="display: flex; align-items: flex-start; gap: 10px; padding: 14px 18px; border-radius: 18px; background: #FFF3DC;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A15C00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16v.01"></path></svg>
    <span style="font-size: 16px; line-height: 1.5; color: #A15C00;">3～5 題就夠了。訪問時想到新問題，也可以當場再加。</span>
  </div>

  <div style="flex-grow: 1;"></div>

  <a href="Interview.html" style="display: flex; align-items: center; justify-content: center; align-self: center; width: 320px; height: 68px; border-radius: 34px; background: #7FC4D6; box-shadow: 0 6px 0 #669DAB; color: #1C2B2F; font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-size: 26px; letter-spacing: 2px; text-decoration: none;">開始採訪</a>

</div>

</body>
</html>
