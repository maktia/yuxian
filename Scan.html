<body>

<div style="width: 412px; height: 917px; box-sizing: border-box; padding: 20px 20px 32px 20px; display: flex; flex-direction: column; gap: 14px; background: #ECF6F9; color: #1C2B2F; font-family: 'Noto Sans TC', 'PingFang TC', sans-serif;">

    <h2 style="margin: 0 0 12px 0; font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-weight: 400; font-size: 21px; line-height: 1.4; color: #1C2B2F;">走廊斜坡太陡，師生推車都卡關</h2>
    <p style="margin: 0; font-size: 18px; line-height: 2; color: #1C2B2F;">本校東側走廊盡頭的斜坡，是<mark style="background: #FDECEA; border-bottom: 3px solid #C9372C; padding: 2px 3px; color: #A12A20; font-weight: 700;">這個超可怕的設計</mark>，<mark style="background: #FFF3DC; border-bottom: 3px solid #E7B860; padding: 2px 3px; color: #A15C00; font-weight: 700;">每天都有人差點跌倒</mark>。校工陳阿姨說：「這個坡太陡了，我每次都要停下來喘一下。」她每天要推回收車經過三次。<mark style="background: #FFF3DC; border-bottom: 3px solid #E7B860; padding: 2px 3px; color: #A15C00; font-weight: 700;">學校應該早就知道了卻不處理</mark>。目前扶手只裝了一側，下雨後地面磁磚會反光。</p>
