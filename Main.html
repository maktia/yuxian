<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S01 首頁：班級座號姓名與組別｜看見・未見｜育賢國中</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans TC','PingFang TC',sans-serif}
a{color:#395860}a:hover{color:#1C2B2F}
</style>
<style>html,body{margin:0;padding:0}</style>
</head>
<body>

<div style="width: 412px; height: 917px; box-sizing: border-box; padding: 40px 28px 32px 28px; display: flex; flex-direction: column; gap: 18px; background: #ECF6F9; color: #1C2B2F; font-family: 'Noto Sans TC', 'PingFang TC', sans-serif;">

  <div style="display: flex; justify-content: space-between; align-items: center;">
    <a href="CourseCode.html" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px 0 12px; border-radius: 20px; background: #FFFFFF; border: 2px solid #ACD9E4; color: #395860; font-size: 15px; font-weight: 700; text-decoration: none;">
      <span style="font-size: 20px;">‹</span><span>上一頁</span>
    </a>
    <div style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px 0 14px; border-radius: 20px; background: #E6F6EC; border: 2px solid #9FD8B4; color: #17663B; font-size: 15px; font-weight: 700;">
      <span style="width: 10px; height: 10px; border-radius: 5px; background: #22A05A;"></span><span>眼鏡已連線</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
    <div style="width: 104px; height: 104px; border-radius: 32px; background: #CCE7EF; border: 3px solid #ACD9E4; display: flex; align-items: center; justify-content: center;">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#395860" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="14" r="4"></circle><circle cx="18" cy="14" r="4"></circle><path d="M10 14h4"></path><path d="M2 12V9h3"></path><path d="M22 12V9h-3"></path></svg>
    </div>
    <h1 style="margin: 0; font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-weight: 400; font-size: 34px; letter-spacing: 3px; line-height: 1.2;">看見．未見</h1>
  </div>

  

  <div style="display: flex; gap: 12px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;">
      <label for="cls" style="font-size: 17px; font-weight: 700; color: #1C2B2F;">班級</label>
      <input id="cls" type="text" placeholder="例 七年 3 班" style="box-sizing: border-box; width: 100%; height: 60px; padding: 0 18px; border-radius: 30px; background: #FFFFFF; border: 3px solid #ACD9E4; font-family: 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 19px; color: #1C2B2F;">
    </div>
    <div style="flex-shrink: 0; width: 116px; display: flex; flex-direction: column; gap: 8px;">
      <label for="seat" style="font-size: 17px; font-weight: 700; color: #1C2B2F;">座號</label>
      <input id="seat" type="text" inputmode="numeric" placeholder="例 12" style="box-sizing: border-box; width: 100%; height: 60px; padding: 0 18px; border-radius: 30px; background: #FFFFFF; border: 3px solid #ACD9E4; font-family: 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 19px; color: #1C2B2F;">
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <label for="name" style="font-size: 17px; font-weight: 700; color: #1C2B2F;">姓名</label>
    <input id="name" type="text" placeholder="例如：王小明" style="box-sizing: border-box; width: 100%; height: 60px; padding: 0 22px; border-radius: 30px; background: #FFFFFF; border: 3px solid #ACD9E4; font-family: 'Noto Sans TC', 'PingFang TC', sans-serif; font-size: 19px; color: #1C2B2F;">
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: baseline; gap: 10px;">
      <span style="font-size: 17px; font-weight: 700; color: #1C2B2F;">你是第幾組</span>
      <span style="font-size: 15px; color: #5E6E73;">點一下就好</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
      <button type="button" style="box-sizing: border-box; height: 58px; border-radius: 29px; background: #FFFFFF; border: 3px solid #ACD9E4; color: #1C2B2F; font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-size: 21px; cursor: pointer;">1 組</button>
      <button type="button" style="box-sizing: border-box; height: 58px; border-radius: 29px; background: #FFFFFF; border: 3px solid #ACD9E4; color: #1C2B2F; font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-size: 21px; cursor: pointer;">2 組</button>
      <button type="button" style="box-sizing: border-box; height: 58px; border-radius: 29px; background: #7FC4D6; border: 3px solid #669DAB; box-shadow: 0 4px 0 #669DAB; color: #1C2B2F; font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-size: 21px; cursor: pointer;">3 組</button>
      <button type="button" style="box-sizing: border-box; height: 58px; border-radius: 29px; background: #FFFFFF; border: 3px solid #ACD9E4; color: #1C2B2F; font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-size: 21px; cursor: pointer;">4 組</button>
      <button type="button" style="box-sizing: border-box; height: 58px; border-radius: 29px; background: #FFFFFF; border: 3px solid #ACD9E4; color: #1C2B2F; font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-size: 21px; cursor: pointer;">5 組</button>
      <button type="button" style="box-sizing: border-box; height: 58px; border-radius: 29px; background: #FFFFFF; border: 3px solid #ACD9E4; color: #1C2B2F; font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-size: 21px; cursor: pointer;">6 組</button>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#395860" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16v.01"></path></svg>
    <span style="font-size: 15px; line-height: 1.5; color: #5E6E73;">寫真名、選對組別，老師才知道作品是誰做的</span>
  </div>

  <div style="flex-grow: 1;"></div>

  <a href="Tasks.html" style="display: flex; align-items: center; justify-content: center; align-self: center; width: 320px; height: 68px; border-radius: 34px; background: #7FC4D6; box-shadow: 0 6px 0 #669DAB; color: #1C2B2F; font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-size: 26px; letter-spacing: 2px; text-decoration: none;">開始上課</a>

</div>

</body>
</html>
