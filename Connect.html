<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S0a 眼鏡連線｜看見・未見｜育賢國中</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans TC','PingFang TC',sans-serif}
a{color:#395860}a:hover{color:#1C2B2F}
</style>
<style>html,body{margin:0;padding:0}</style>
</head>
<body>

<div style="width: 412px; height: 917px; box-sizing: border-box; padding: 40px 32px 32px 32px; display: flex; flex-direction: column; gap: 18px; background: #ECF6F9; color: #1C2B2F; font-family: 'Noto Sans TC', 'PingFang TC', sans-serif;">

  <h1 style="margin: 0; text-align: center; font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 2px; line-height: 1.2;">把眼鏡連上來</h1>

  <div style="align-self: center; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px 0 16px; border-radius: 22px; background: #FFFFFF; border: 2px solid #ACD9E4; color: #3D4A50; font-size: 17px; font-weight: 700;">
    <span style="width: 12px; height: 12px; border-radius: 6px; background: #9A93AD;"></span>
    <span>還沒連上</span>
  </div>

  <div style="align-self: center; width: 156px; height: 156px; border-radius: 78px; background: #CCE7EF; display: flex; align-items: center; justify-content: center;">
    <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#395860" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="14" r="4"></circle><circle cx="18" cy="14" r="4"></circle><path d="M10 14h4"></path><path d="M2 12V9h3"></path><path d="M22 12V9h-3"></path></svg>
  </div>

  <div style="box-sizing: border-box; padding: 20px 24px; border-radius: 24px; background: #FFFFFF; border: 3px solid #ACD9E4; display: flex; flex-direction: column; gap: 12px;">
    <div style="font-size: 18px; font-weight: 700; color: #1C2B2F;">連線前先做這三件事</div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 15px; background: #CCE7EF; color: #1C2B2F; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">1</span>
      <span style="font-size: 18px; line-height: 1.5; color: #3D3752;">把眼鏡戴上</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 15px; background: #CCE7EF; color: #1C2B2F; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">2</span>
      <span style="font-size: 18px; line-height: 1.5; color: #3D3752;">按住眼鏡左邊的按鈕 2 秒</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 15px; background: #CCE7EF; color: #1C2B2F; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">3</span>
      <span style="font-size: 18px; line-height: 1.5; color: #3D3752;">看到眼鏡亮藍燈，再按下面的按鈕</span>
    </div>
  </div>

  <div style="display: flex; align-items: flex-start; gap: 10px; padding: 14px 18px; border-radius: 18px; background: #FFF3DC;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A15C00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;" aria-hidden="true"><path d="M12 3l9 16H3z"></path><path d="M12 9v4"></path><path d="M12 16.5v.01"></path></svg>
    <span style="font-size: 16px; line-height: 1.5; color: #A15C00;">連不上也沒關係，可以先略過，用平板的相機一樣能上課。</span>
  </div>

  <div style="flex-grow: 1;"></div>

  <a href="CourseCode.html" style="display: flex; align-items: center; justify-content: center; align-self: center; width: 320px; height: 68px; border-radius: 34px; background: #7FC4D6; box-shadow: 0 6px 0 #669DAB; color: #1C2B2F; font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-size: 26px; letter-spacing: 2px; text-decoration: none;">開始連線</a>

  <a href="CourseCode.html" style="display: flex; align-items: center; justify-content: center; align-self: center; box-sizing: border-box; width: 320px; height: 58px; border-radius: 29px; background: #FFFFFF; border: 3px solid #ACD9E4; color: #395860; font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-size: 21px; letter-spacing: 1px; text-decoration: none;">先略過，之後再連</a>

</div>
