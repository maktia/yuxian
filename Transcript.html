<body>

<div style="width: 412px; height: 917px; box-sizing: border-box; padding: 20px 20px 32px 20px; display: flex; flex-direction: column; gap: 14px; background: #ECF6F9; color: #1C2B2F; font-family: 'Noto Sans TC', 'PingFang TC', sans-serif;">

  <div style="display: flex; justify-content: space-between; align-items: center;">
    <a href="Interview.html" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px 0 12px; border-radius: 20px; background: #FFFFFF; border: 2px solid #ACD9E4; color: #395860; font-size: 15px; font-weight: 700; text-decoration: none;">
      <span style="font-size: 20px;">‹</span><span>上一頁</span>
    </a>
    <div style="display: flex; align-items: center; height: 40px; padding: 0 14px; border-radius: 20px; background: #FFFFFF; border: 2px solid #ACD9E4; color: #1C2B2F; font-size: 15px; font-weight: 700;">校工陳阿姨・3 題</div>
  </div>

  <h1 style="margin: 4px 0 0 0; font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 2px; line-height: 1.2;">挑出最有力的一句</h1>
  <p style="margin: -4px 0 0 0; font-size: 17px; line-height: 1.55; color: #3D3752;">逐字稿照題目分好段了。用手指把想留下的句子劃起來，或按下面的按鈕讓 AI 推薦。</p>

  <div style="box-sizing: border-box; flex-grow: 1; padding: 18px 20px; border-radius: 24px; background: #FFFFFF; border: 3px solid #ACD9E4; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; background: #CCE7EF; font-size: 13px; font-weight: 700; color: #10505F;">第 1 題</span>
      <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #5E6E73;">你每天都要推車經過這邊嗎？</p>
      <p style="margin: 0; font-size: 18px; line-height: 1.8; color: #1C2B2F;">對啊，一天三趟。<mark style="background: #FFF3DC; border-bottom: 3px solid #E7B860; padding: 2px 3px; color: #1C2B2F;">這個坡太陡了，我每次都要停下來喘一下，下雨更滑。</mark></p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; background: #CCE7EF; font-size: 13px; font-weight: 700; color: #10505F;">第 2 題</span>
      <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #5E6E73;">有跟學校講過嗎？</p>
      <p style="margin: 0; font-size: 18px; line-height: 1.8; color: #1C2B2F;">講過，他們說再看看。其實我自己還撐得住啦，我是怕坐輪椅的同學。</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; background: #CCE7EF; font-size: 13px; font-weight: 700; color: #10505F;">第 3 題</span>
      <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #5E6E73;">你覺得要怎麼改比較好？</p>
      <p style="margin: 0; font-size: 18px; line-height: 1.8; color: #1C2B2F;">兩邊都裝扶手就好很多了。</p>
    </div>
  </div>

  <button type="button" style="box-sizing: border-box; width: 100%; height: 60px; border-radius: 30px; background: #FFFFFF; border: 3px dashed #7FC4D6; color: #1F6E85; font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-size: 20px; letter-spacing: 1px; cursor: pointer;">不知道挑哪句？讓 AI 推薦</button>

  <div style="box-sizing: border-box; padding: 16px 18px; border-radius: 22px; background: #FFFFFF; border: 3px solid #7FC4D6; box-shadow: 0 5px 0 #CCE7EF; display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 15px; font-weight: 700; color: #1F6E85;">已經挑起來的金句（1 句）</span>
    <p style="margin: 0; font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-size: 20px; line-height: 1.6; color: #1C2B2F;">「這個坡太陡了，我每次都要停下來喘一下。」</p>
    <span style="font-size: 15px; color: #5E6E73;">— 校工 陳阿姨</span>
  </div>

  <a href="Draft.html" style="display: flex; align-items: center; justify-content: center; align-self: center; width: 320px; height: 68px; border-radius: 34px; background: #7FC4D6; box-shadow: 0 6px 0 #669DAB; color: #1C2B2F; font-family: 'Huninn', 'Noto Sans TC', sans-serif; font-size: 26px; letter-spacing: 2px; text-decoration: none;">放進新聞草稿</a>

</div>
